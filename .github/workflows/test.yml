name: Test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

  push:
    branches:
      - main
    tags:
      - "**"

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.18', '1.19', '1.20', '1.21', '1.22', '1.23', '1.24', '1.25']

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: go version

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Run tests with DBC and coverage
        run: go test -v -race -tags debug -covermode atomic -coverprofile=covprofile ./...

      - name: Run fuzz tests (short)
        run: |
          go test -run=^$ -fuzz=FuzzPathHelpers -fuzztime=5s -tags debug ./...
          go test -run=^$ -fuzz=FuzzOpenReadFromBytes -fuzztime=5s -tags debug ./...
          go test -run=^$ -fuzz=FuzzRoundTripPackage -fuzztime=5s -tags debug ./...

      - name: Install goveralls
        if: matrix.go-version == '1.18'
        run: go install github.com/mattn/goveralls@latest

      - name: Send coverage to Coveralls
        if: matrix.go-version == '1.18'
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=covprofile -service=github
